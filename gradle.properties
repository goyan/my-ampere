org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
# Gradle 8.11 ne sait pas lancer son propre daemon sur un JDK 25+ (ambient possible sur le
# PATH/JAVA_HOME de la machine). Ce réglage ne fixe que le JVM qui exécute Gradle lui-même,
# pas la toolchain de compilation du projet (pilotée par kotlin { jvmToolchain(17) } dans
# app/build.gradle.kts).
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
# jvmToolchain(17) a besoin d'un JDK 17 local. L'auto-détection intégrée de Gradle ne scanne
# pas le layout Homebrew (/opt/homebrew/opt/*) par défaut : le pointer explicitement ici évite
# de dépendre du plugin foojay-resolver-convention (auto-téléchargement réseau, non nécessaire
# puisque le JDK est déjà installé — et son artefact s'est révélé indisponible en sandbox).
# Home imbriqué (keg-only) : .../opt/openjdk@17/libexec/openjdk.jdk/Contents/Home, pas
# .../opt/openjdk@17 qui n'expose que bin/ par symlink.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
